name: SDOT Closure Search

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find Possible Closures
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          jq '.features[]
            | select(
                .properties.core_details.description.Name
                | test("closure|closed|ramp"; "i")
              )
            | {
                name: .properties.core_details.description.Name,
                road: .properties.core_details.road_names,
                start: .properties.start_date,
                end: .properties.end_date
              }' workzones.json

      - name: Notify Discord
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"✅ SDOT Closure Search completed"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"
