name: SDOT Closure Search

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find Possible Closures
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          echo "=== POSSIBLE CLOSURES ==="

          jq -r '
            .features[]
            | select(.properties.vehicle_impact == "all-lanes-closed")
            | {
                name: (.properties.core_details.description.Name // ""),
                road: (.properties.core_details.road_names // []),
                start: .properties.start_date,
                end: .properties.end_date
              }
            | select(
                .name
                | test("closure|closed"; "i")
              )
          ' workzones.json \
          | jq -s 'unique_by(.name)[]'

      - name: Notify Discord
        if: always()
        run: |
          echo '{"content":"✅ SDOT Closure Search completed"}' > payload.json

          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "${{ secrets.DISCORD_WEBHOOK }}"
