name: SDOT Upcoming Closures and Events

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

jobs:
  sdot:
    runs-on: ubuntu-latest

    steps:
      - name: Get SDOT Data
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

      - name: Build Discord Message
        run: |
          PAST=$(date -d "-30 days" +%Y-%m-%d)
          FUT
