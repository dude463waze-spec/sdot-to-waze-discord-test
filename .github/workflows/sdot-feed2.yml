name: SDOT Feed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

      - name: Query SDOT
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=roadevent" \
            | jq '.features[]
              | select(.properties.vehicle_impact=="all-lanes-closed")
              | {
                  road: .properties.core_details.road_names,
                  start: .properties.start_date,
                  end: .properties.end_date,
                  permit: .properties.core_details.description.PermitNumber
                }'

      - name: Post to Discord
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"SDOT query completed"}' \
            ${{ secrets.DISCORD_WEBHOOK }}
