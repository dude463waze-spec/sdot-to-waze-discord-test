name: SDOT Feed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Full Closures
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=roadevent" \
            | jq '
              .features[]
              | select(.properties.vehicle_impact=="all-lanes-closed")
              | {
                  road: .properties.core_details.road_names,
                  start: .properties.start_date,
                  end: .properties.end_date
                }
            ' | head -100

      - name: Post to Discord
        run: |
          TIMESTAMP=$(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M:%S %p %Z')

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"SDOT query completed at $TIMESTAMP\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
