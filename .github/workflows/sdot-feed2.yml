name: SDOT Feed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show One Incident
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=incident" \
            | jq '.features[0]'

      - name: Post to Discord
        run: |
          TIMESTAMP=$(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M:%S %p %Z')

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"Incident record test completed at $TIMESTAMP\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
