name: SDOT All Lanes Closed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Closed Roads
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          echo "=== ALL LANES CLOSED ==="

          jq '.features[]
            | select(.properties.vehicle_impact == "all-lanes-closed")' \
            workzones.json

      - name: Notify Discord
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"✅ All-lanes-closed scan completed"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"
