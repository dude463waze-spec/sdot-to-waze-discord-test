name: SDOT Restriction Search

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Find Workzones With Restrictions
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          jq '.features[]
             | select(.properties.restrictions | length > 0)' \
             workzones.json
