name: SDOT Feed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get SDOT Incident
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=incident" \
            > incident.json

          echo "ROAD=$(jq -r '.features[0].properties.core_details.road_names[0]' incident.json)" >> $GITHUB_ENV
          echo "DESC=$(jq -r '.features[0].properties.core_details.description.IncidentDescription' incident.json)" >> $GITHUB_ENV
          echo "TYPE=$(jq -r '.features[0].properties.types_of_incident[0].incident_category' incident.json)" >> $GITHUB_ENV
          echo "ID=$(jq -r '.features[0].properties.core_details.description.IncidentId' incident.json)" >> $GITHUB_ENV

      - name: Post to Discord
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$(jq -n \
              --arg road "$ROAD" \
              --arg type "$TYPE" \
              --arg desc "$DESC" \
              --arg id "$ID" \
              '{content: ("🚨 SDOT Incident\n\nRoad: " + $road + "\nType: " + $type + "\nDescription: " + $desc + "\nIncident ID: " + $id)}')" \
            "${{ secrets.DISCORD_WEBHOOK }}"
