name: SDOT Feed Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show One Full Closure Record
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=roadevent" \
            | jq '
              .features[]
              | select(.properties.vehicle_impact=="all-lanes-closed")
            ' \
            | head -300

      - name: Post to Discord
        run: |
          TIMESTAMP=$(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M:%S %p %Z')

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"Retrieved full closure detail at $TIMESTAMP\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
