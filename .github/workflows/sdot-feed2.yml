name: SDOT Vehicle Impacts

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Vehicle Impact Types
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          echo "=== VEHICLE IMPACTS ==="

          jq -r '.features[].properties.vehicle_impact' workzones.json \
            | sort | uniq -c

      - name: Discord Done Message
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"✅ Vehicle impact scan finished"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"
