name: SDOT Recent Closures

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Recent All-Lanes-Closed
        run: |
          curl -s \
            -H "X-Api-Key: ${{ secrets.SDOT_API_KEY }}" \
            "https://rowimpacts.adc.seattle.gov/api/v1/feed?type=workzone" \
            > workzones.json

          jq '.features[]
            | select(.properties.vehicle_impact == "all-lanes-closed")
            | {
                name: .properties.core_details.description.Name,
                road: .properties.core_details.road_names,
                created: .properties.core_details.creation_date,
                updated: .properties.core_details.update_date,
                start: .properties.start_date,
                end: .properties.end_date
              }' workzones.json
